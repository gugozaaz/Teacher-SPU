<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Test Runner — Session 02 Presentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f19;
            --surface: #131b2e;
            --border: #1e293b;
            --primary: #6366f1;
            --secondary: #06b6d4;
            --success: #10b981;
            --fail: #f43f5e;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', 'Noto Sans Thai', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 1.5rem;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
        }

        .btn-run {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-run:hover { opacity: 0.9; }
        .btn-run.secondary { background: var(--surface); border: 1px solid var(--primary); color: var(--primary); }

        .summary-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .metric {
            flex: 1;
            text-align: center;
            border-right: 1px solid var(--border);
        }
        .metric:last-child { border-right: none; }
        .metric .val { font-size: 2rem; font-weight: 700; }
        .metric .lbl { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }

        .table-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: rgba(255,255,255,0.02);
            color: var(--secondary);
            font-weight: 600;
        }

        .badge-status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .badge-pass { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
        .badge-fail { background: rgba(244, 63, 94, 0.2); color: #f87171; border: 1px solid rgba(244, 63, 94, 0.4); }

        .preview-frame {
            width: 100%;
            height: 720px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: black;
            transition: height 0.3s ease;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🧪 Automated Layout Test Runner (Session 02)</h1>
    <div class="controls">
        <button id="run-btn-720" class="btn-run" onclick="runAutomatedTests(720)">▶ Test 16:9 (1280x720)</button>
        <button id="run-btn-800" class="btn-run secondary" onclick="runAutomatedTests(800)">▶ Test 16:10 (1280x800)</button>
    </div>
</div>

<div class="summary-card">
    <div class="metric">
        <div id="metric-total" class="val">-</div>
        <div class="lbl">Total Slides</div>
    </div>
    <div class="metric">
        <div id="metric-passed" class="val" style="color: var(--success);">-</div>
        <div class="lbl">Passed</div>
    </div>
    <div class="metric">
        <div id="metric-failed" class="val" style="color: var(--fail);">-</div>
        <div class="lbl">Failed</div>
    </div>
    <div class="metric">
        <div id="metric-rate" class="val" style="color: var(--secondary);">-</div>
        <div class="lbl">Success Rate</div>
    </div>
    <div class="metric">
        <div id="metric-resolution" class="val" style="font-size: 1.5rem; color: #cbd5e1;">N/A</div>
        <div class="lbl">Tested Resolution</div>
    </div>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th style="width: 80px;">Slide #</th>
                <th>Slide Title / Topic</th>
                <th style="width: 140px;">Content Height</th>
                <th style="width: 140px;">Max Allowed</th>
                <th style="width: 120px;">Margin</th>
                <th style="width: 100px;">Status</th>
            </tr>
        </thead>
        <tbody id="test-results-body">
            <tr>
                <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">
                    Click a test button above or wait for auto-run...
                </td>
            </tr>
        </tbody>
    </table>
</div>

<h3 style="margin-bottom: 10px; color: var(--text-muted); font-size: 1rem;" id="preview-label">📺 Live Slide Viewport Inspection</h3>
<iframe id="presentation-frame" class="preview-frame" src="session-02-presentation-16-9.html"></iframe>

<script>
    async function runAutomatedTests(targetHeight = 720) {
        const frame = document.getElementById('presentation-frame');
        const targetSrc = targetHeight === 720 ? 'session-02-presentation-16-9.html' : 'session-02-presentation-16-10.html';
        
        // Update frame height to simulate the screen
        frame.style.height = targetHeight + 'px';
        document.getElementById('preview-label').innerText = `📺 Live Slide Viewport Inspection (1280x${targetHeight} Base Scale)`;
        document.getElementById('metric-resolution').innerText = targetHeight === 720 ? '1280x720' : '1280x800';

        // Update buttons state
        const btn720 = document.getElementById('run-btn-720');
        const btn800 = document.getElementById('run-btn-800');
        
        btn720.disabled = true;
        btn800.disabled = true;
        
        if (targetHeight === 720) {
            btn720.innerText = "⏳ Running...";
        } else {
            btn800.innerText = "⏳ Running...";
        }

        // Change source if needed
        let needsReload = false;
        if (!frame.src.includes(targetSrc)) {
            frame.src = targetSrc;
            needsReload = true;
        }

        // Wait for frame to be fully loaded
        await new Promise(resolve => {
            const checkReady = () => {
                if (frame.contentWindow && frame.contentWindow.Reveal && frame.contentWindow.Reveal.isReady()) {
                    resolve();
                } else {
                    setTimeout(checkReady, 500);
                }
            };
            
            if (needsReload) {
                frame.onload = () => setTimeout(checkReady, 500);
            } else {
                checkReady();
            }
        });

        const win = frame.contentWindow;
        
        const doc = frame.contentDocument || win.document;
        const reveal = win.Reveal;
        const sections = doc.querySelectorAll('.reveal .slides > section');
        const tbody = document.getElementById('test-results-body');
        tbody.innerHTML = '';

        let passed = 0;
        let failed = 0;
        const total = sections.length;
        const maxHeight = targetHeight;

        for (let i = 0; i < total; i++) {
            // Navigate Reveal to slide
            reveal.slide(i);
            await new Promise(r => setTimeout(r, 60));

            const sec = sections[i];
            const scrollH = sec.scrollHeight;
            const title = sec.querySelector('h1, h2')?.innerText?.trim() || `Slide ${i+1}`;
            
            // Allow 4px threshold for sub-pixel rendering differences
            const isPass = scrollH <= maxHeight + 4; 
            const marginRemaining = maxHeight - scrollH;

            if (isPass) passed++;
            else failed++;

            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>#${i+1}</strong></td>
                <td>${title}</td>
                <td><span style="font-family: 'Fira Code'">${scrollH}px</span></td>
                <td><span style="font-family: 'Fira Code'">${maxHeight}px</span></td>
                <td><span style="color: ${marginRemaining >= -4 ? '#34d399' : '#f87171'}; font-family: 'Fira Code'">${marginRemaining > 0 ? '+' : ''}${marginRemaining}px</span></td>
                <td><span class="badge-status ${isPass ? 'badge-pass' : 'badge-fail'}">${isPass ? 'PASSED' : 'OVERFLOW'}</span></td>
            `;
            tbody.appendChild(row);
        }

        document.getElementById('metric-total').innerText = total;
        document.getElementById('metric-passed').innerText = passed;
        document.getElementById('metric-failed').innerText = failed;
        document.getElementById('metric-rate').innerText = `${Math.round((passed/total)*100)}%`;

        btn720.disabled = false;
        btn800.disabled = false;
        btn720.innerText = "▶ Test 16:9 (1280x720)";
        btn800.innerText = "▶ Test 16:10 (1280x800)";
        
        console.log(`AUTOMATED_TEST_SUMMARY (${targetHeight}p): PASSED ${passed}/${total} (${Math.round((passed/total)*100)}%)`);
        
        // Reset slide to beginning
        reveal.slide(0);
    }

    window.addEventListener('load', () => {
        // Auto run 16:9 test by default
        setTimeout(() => runAutomatedTests(720), 1200);
    });
</script>

</body>
</html>
